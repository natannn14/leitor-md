name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. Build Onedir (para o Instalador - abertura instantânea)
      - name: Build Installer Binary (--onedir)
        run: |
          python -m PyInstaller --noconsole --noconfirm `
            --name LeitorMD `
            --icon=app.ico `
            --add-data "app.ico;." `
            --collect-all PyQt6 `
            --collect-all PyQt6.QtWebEngineCore `
            --collect-all PyQt6.QtWebEngineWidgets `
            --exclude-module tkinter `
            md_reader.py

      # 2. Compilar o Instalador Oficial com Inno Setup
      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Build Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      # 3. Build Onefile (para o Portátil - 1 único arquivo executável limpo)
      - name: Build Portable Binary (--onefile)
        run: |
          python -m PyInstaller --noconsole --noconfirm `
            --name LeitorMD-portable `
            --icon=app.ico `
            --add-data "app.ico;." `
            --collect-all PyQt6 `
            --collect-all PyQt6.QtWebEngineCore `
            --collect-all PyQt6.QtWebEngineWidgets `
            --exclude-module tkinter `
            --onefile `
            md_reader.py

      # 4. Empacotar a versão portátil em .zip limpo (sem pasta _internal)
      - name: Package Portable ZIP
        run: |
          New-Item -ItemType Directory -Path staging-portable
          Copy-Item dist\LeitorMD-portable.exe staging-portable\LeitorMD.exe
          Copy-Item documento_exemplo.md staging-portable\
          Compress-Archive -Path staging-portable\* -DestinationPath LeitorMD-portable.zip -Force

      # 5. Publicar na aba Releases do GitHub
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            setup_output/LeitorMD_Setup.exe
            LeitorMD-portable.zip
            dist/LeitorMD-portable.exe

      # 6. Upload de artefatos para execuções manuais do workflow
      - name: Upload Artifacts (for manual workflow runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: LeitorMD-Windows-Binaries
          path: |
            setup_output/LeitorMD_Setup.exe
            LeitorMD-portable.zip
            dist/LeitorMD-portable.exe
