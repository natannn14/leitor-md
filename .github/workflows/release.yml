name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconsole --noconfirm `
            --name LeitorMD `
            --icon=app.ico `
            --add-data "app.ico;." `
            --collect-all PyQt6 `
            --collect-all PyQt6.QtWebEngineCore `
            --collect-all PyQt6.QtWebEngineWidgets `
            md_reader.py

      - name: Copy extra files to build folder
        run: |
          Copy-Item documento_exemplo.md dist\LeitorMD\

      - name: Create Portable ZIP
        run: |
          Compress-Archive -Path dist\LeitorMD\* -DestinationPath LeitorMD-portable.zip -Force

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Build Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            setup_output/LeitorMD_Setup.exe
            LeitorMD-portable.zip

      - name: Upload Artifacts (for manual workflow runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: LeitorMD-Windows-Binaries
          path: |
            setup_output/LeitorMD_Setup.exe
            LeitorMD-portable.zip
